<script>
// Self-healing load: if the 3D view crashes, loses its GPU context, stops drawing, or stalls while loading,
// quietly reload the page (up to 3 times per visit) behind the curtain instead of leaving a broken scene.
(() => {
  const KEY = 'bp-reloads', MAX = 3, t0 = performance.now();
  const get = () => { try { return +(sessionStorage.getItem(KEY) || 0); } catch (e) { return MAX; } };
  const set = v => { try { v ? sessionStorage.setItem(KEY, String(v)) : sessionStorage.removeItem(KEY); } catch (e) {} };
  window.__bpBeat = t0;          // last sign of loading progress (bytes arriving, model parsed)
  window.__bpFrame = 0;          // last successfully rendered frame
  window.__bpRecover = why => {
    if (window.__bpRecovering) return true;
    const n = get();
    console.warn('[bill pay] scene problem:', why, '| automatic reload', n + 1, 'of', MAX);
    if (n >= MAX) return false;  // give up and let the page show its message
    window.__bpRecovering = true; set(n + 1);
    const t = document.getElementById('mlText'); if (t) t.textContent = 'Resetting the stage…';
    const g = document.getElementById('mlGate'); if (g) g.classList.remove('ml-out');
    setTimeout(() => location.reload(), 350);
    return true;
  };
  let healthySince = 0;
  document.addEventListener('visibilitychange', () => { const now = performance.now(); window.__bpBeat = Math.max(window.__bpBeat, now); window.__bpFrame = window.__bpFrame && now; });
  let lastTick = performance.now();
  setInterval(() => {
    const now = performance.now(), gap = now - lastTick; lastTick = now;
    if (gap > 3000) { window.__bpBeat = now; if (window.__bpFrame) window.__bpFrame = now; return; }   // computer slept or tab was throttled: start the clocks again
    if (document.hidden || window.__bpRecovering || window.__bpGaveUp) return;
    if (!window.__ready) {
      if (now - window.__bpBeat > 25000) window.__bpRecover('loading stalled');
      return;
    }
    if (window.__bpFrame && now - window.__bpFrame > 5000) { window.__bpRecover('rendering stopped'); return; }
    if (!healthySince) healthySince = now; else if (now - healthySince > 10000) set(0);   // a good run resets the budget
  }, 1000);
})();
</script>
<script>
// Marquee loader: bulbs light left to right as the scene actually loads, then the house opens.
(() => {
  const gate = document.getElementById("mlGate"), text = document.getElementById("mlText"), prog = document.getElementById("mlProg");
  const bulbs = [...gate.querySelectorAll(".ml-bulb")], gf = document.getElementById("mlGFace"), ge = document.getElementById("mlGExt");
