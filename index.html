  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  const need = (2 * W + 0.07) / 2 / tanH;     // distance at which the open spread (plus a margin) fits across
  frame.dist = Math.max(D, need); frame.fov = camera.fov;
}
// camera settings: distance (as a multiple of the auto framing), tilt from straight down, orbit around the table,
// the point it looks at, an optional lens override, and how far the pointer moves it (true 3D parallax, in metres)
const CAM = { zoom: 1, tilt: 33, orbit: -14.5, panX: 0, panZ: 0, fov: 0, parallax: 0.025 };   // chosen with the camera panel
const _t = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3();
// the finale: the camera dives into the Dominion printed on the last page, the screen fades, and the street page takes over
const NEXT = 'street.html#from-book';
const zoom = { t: -1, from: new THREE.Vector3(), look: new THREE.Vector3(), to: new THREE.Vector3(), target: new THREE.Vector3() };
function startZoom() {
  if (zoom.t >= 0) return;
  const uv = PAGES[PAGES.length - 1].plateUV || { x: 0.5, y: 0.66 };
  // the last page lies on the right-hand page block: x runs out from the spine, page-top is the far edge
  zoom.target.set(book.position.x - W / 2 + 0.0015 + uv.x * PW, tb + tp / 2 + 0.004, book.position.z - PH / 2 + uv.y * PH);
  zoom.from.copy(camera.position); zoom.look.set(CAM.panX, 0, CAM.panZ);
  zoom.to.copy(zoom.target).add(new THREE.Vector3(0, 0.035, 0.012));
  zoom.t = 0; zoom.t0 = performance.now(); hint.classList.add('off'); skip.classList.add('off');
  setTimeout(() => document.getElementById('fade').classList.add('on'), 750);
  setTimeout(() => { location.href = NEXT; }, 1350);
}
const _zl = new THREE.Vector3();
function placeCamera() {
  if (zoom.t >= 0) {
    // one smooth curve for both the move and the aim (no kinks), easing in and settling into the page
    const x = Math.min(1, zoom.t / 1.4), k = x * x * x * (x * (x * 6 - 15) + 10);
    camera.position.lerpVectors(zoom.from, zoom.to, k);
    camera.lookAt(_zl.lerpVectors(zoom.look, zoom.target, THREE.MathUtils.smootherstep(x, 0, 0.8)));
    return;
  }
  const co = THREE.MathUtils.smootherstep(camOpen, 0.0, 0.47);           // eases across with the cover as it swings open
  const auto = frame.fov || PHOTO.fov, fov = CAM.fov || auto;
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  // a lens override dollies to keep the same framing
  const d = (frame.dist || D) * CAM.zoom * THREE.MathUtils.lerp(0.86, 1, co) * Math.tan(THREE.MathUtils.degToRad(auto / 2)) / Math.tan(THREE.MathUtils.degToRad(fov / 2));
  const th = THREE.MathUtils.degToRad(CAM.tilt), yaw = THREE.MathUtils.degToRad(CAM.orbit);
  _t.set(CAM.panX + SLIDE * (1 - co), 0, CAM.panZ);
  camera.position.set(_t.x + Math.sin(yaw) * Math.sin(th) * d, d * Math.cos(th), _t.z + Math.cos(yaw) * Math.sin(th) * d);
  camera.lookAt(_t); camera.updateMatrixWorld();

  _r.setFromMatrixColumn(camera.matrixWorld, 0); _u.setFromMatrixColumn(camera.matrixWorld, 1);
  camera.position.addScaledVector(_r, ptr.sx * CAM.parallax).addScaledVector(_u, -ptr.sy * CAM.parallax);

}
// ---------- lighting: key light direction & strength, room fill, reflections (what the gold lettering mirrors) ----------
// key light direction: azimuth measured round the table from the viewer's side (0° = from the front, 90° = from the right),
// elevation above the table. LIGHT is what the tuning panel edits.
const LIGHT = { az: -180, el: 67, key: 1.05, fill: 0.62, gold: 0.55, envRot: 0 };   // chosen with the lighting panel: light from straight behind the book
const roomEnv = new RoomEnvironment();
let envRT = null, envBusy = false;
function applyLight() {
  const az = THREE.MathUtils.degToRad(LIGHT.az), el = THREE.MathUtils.degToRad(LIGHT.el), r = 1.1;
  key.position.set(BOOK_CENTER.x + Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, BOOK_CENTER.z + Math.cos(az) * Math.cos(el) * r);
  key.intensity = LIGHT.key; hemi.intensity = LIGHT.fill; mCover.envMapIntensity = LIGHT.gold;
}
function applyEnv() {            // turn the reflected room around the book (rebuilt at most once a frame)
  if (envBusy) return; envBusy = true;
  requestAnimationFrame(() => {
    envBusy = false; roomEnv.rotation.y = THREE.MathUtils.degToRad(LIGHT.envRot);
    const rt = pmrem.fromScene(roomEnv, 0.04); scene.environment = rt.texture; if (envRT) envRT.dispose(); envRT = rt;
  });
}
applyLight();
addEventListener('resize', frame);
addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; ptr.x = (e.clientX / innerWidth) * 2 - 1; ptr.y = (e.clientY / innerHeight) * 2 - 1; });

// ---------- interaction ----------
const hint = document.getElementById('hint');
const picker = new THREE.Raycaster(), ndc = new THREE.Vector2();
const overBook = (e) => { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); picker.setFromCamera(ndc, camera); return picker.intersectObject(book, true).length > 0; };
function toggle() { seqGoal = seqGoal ? 0 : SEQ.end; hint.textContent = seqGoal ? 'Close the book' : 'Open the book'; }
// click anywhere: hurry to the next page (or straight into the theatre on the last one)
let rush = 0;
function advance() {
  if (zoom.t >= 0) return;
  if (seqT >= SEQ.end - 1e-3) { startZoom(); return; }
  if (!seqGoal) { seqGoal = SEQ.end; hint.textContent = 'Close the book'; }
  const t0 = SEQ.cover + SEQ.hold, per = SEQ.flip + SEQ.read;
  if (seqT < SEQ.cover) { rush = SEQ.cover; return; }                          // still opening: finish it quickly
  if (seqT < t0) { seqT = t0; poseAt(seqT); return; }                          // holding on the cover spread
  const k = Math.floor((seqT - t0) / per), inFlip = (seqT - t0) - k * per < SEQ.flip;
  if (inFlip) { rush = t0 + k * per + SEQ.flip; return; }                       // mid turn: finish it quickly
  seqT = Math.min(SEQ.end, t0 + (k + 1) * per); poseAt(seqT); rush = Math.min(SEQ.end, seqT + SEQ.flip);   // reading: turn now, fast
}
renderer.domElement.addEventListener('click', advance);
renderer.domElement.addEventListener('pointermove', e => document.body.classList.toggle('over-book', overBook(e)));
hint.addEventListener('click', toggle);
// skip: straight to the finale spread (where the move into the landing page will start); it bows out once you are there
const skip = document.getElementById('skip');
skip.addEventListener('click', () => { seqT = seqGoal = SEQ.end; poseAt(seqT); hint.textContent = 'Close the book'; setTimeout(startZoom, 150); });
window.__book = { set: v => { seqT = seqGoal = v * SEQ.end; poseAt(seqT); }, seek: t => { seqT = seqGoal = t; poseAt(t); }, toggle, get: () => seqT / SEQ.end };

// ---------- go ----------
new THREE.ImageLoader().load(ASSET['height_flat.png'], img => {   // the table is bare now: flat
  buildTable(img); frame();
  let revealed = false;
  const reveal = () => { if (revealed) return; revealed = true; document.getElementById('veil').classList.add('off'); setTimeout(() => { skip.classList.remove('off'); }, 900); window.__ready = true;
    setTimeout(() => { if (!seqGoal && zoom.t < 0) toggle(); }, 2000); };   // a moment on the cover first
  THREE.DefaultLoadingManager.onLoad = reveal; setTimeout(reveal, 4000);
});
let last = performance.now(), autoHold = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ptr.sx += (ptr.x - ptr.sx) * Math.min(1, dt * 2.5); ptr.sy += (ptr.y - ptr.sy) * Math.min(1, dt * 2.5);
  if (seqT !== seqGoal) { const dir = Math.sign(seqGoal - seqT); seqT += dir * dt * (dir > 0 ? (seqT < rush ? 3.5 : 1) : SEQ.rewind); seqT = Math.min(SEQ.end, Math.max(0, seqT)); if (Math.abs(seqT - seqGoal) < 1e-3 || Math.sign(seqGoal - seqT) !== dir) seqT = seqGoal; poseAt(seqT); }
  candle.intensity = 0 * (0.85 + 0.15 * Math.sin(now * 0.011) * Math.sin(now * 0.0037 + 1.3));
  if (zoom.t >= 0) zoom.t = (performance.now() - zoom.t0) / 1000;   // wall clock, so the dive stays in step with the fade and hand-off
  else if (seqGoal === SEQ.end && seqT >= SEQ.end) { autoHold += dt; if (autoHold > 3.0) startZoom(); }   // hold 3s on the last page before the dive
  placeCamera(); renderer.render(scene, camera);
});
</script>
