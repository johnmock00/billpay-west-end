  /* Ramp tokens, copied from computed styles on ramp.com/lp2/corporate-cards */
  :root {
    --ramp-primary: lab(2.83994 0.367254 0.969091);
    --ramp-hushed: lab(2.83994 0.367254 0.969091 / 0.6);
    --ramp-field-border: rgba(33, 33, 33, 0.1);
    --ramp-field-border-focus: rgba(33, 33, 33, 0.2);
    --font: Lausanne, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #12031f;
    color: #fff; font-family: var(--font); font-feature-settings: "ss01";
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Content */
  .page { position: relative; z-index: 1; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
          align-items: center; justify-content: center; padding: 48px 16px; text-align: center; }
  .marquee { display: block; width: 260px; max-width: 100%; height: auto; margin: 0 auto 41px; position: relative; z-index: 10;
             user-select: none; -webkit-user-drag: none; }
  .marquee img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  /* Bulb glimmer: three single bulbs flash out of step */
  .marquee .bulbs { position: absolute; inset: 0; overflow: visible; pointer-events: none; mix-blend-mode: screen; opacity: .15;
                    animation: bulb 2.4s ease-in-out infinite; }
  .marquee .b1 { animation-duration: 2.9s; animation-delay: -1.1s; }
  .marquee .b2 { animation-duration: 3.4s; animation-delay: -2.2s; }
  @keyframes bulb { 0%, 30%, 70%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .marquee .bulbs { animation: none; opacity: 0; } }
  @media (max-width: 767px) and (hover: none) and (pointer: coarse) {
    .marquee { width: 230px; margin-bottom: 31px; }
  }
  @media (max-width: 767px) and (max-height: 620px) and (hover: none) and (pointer: coarse) {   /* short phones: keep the button above the fold too */
    .page { padding-top: 20px; padding-bottom: 20px; }
    .marquee { margin-bottom: 22px; }
    form { margin-top: 28px; }
  }
  .copy { width: 100%; max-width: 403px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* H1 — Ramp: Lausanne 400, 34px / 38px, ss01, centered */
  h1 { margin: 0; font-family: Cinzel, "Times New Roman", serif; font-size: 34px; font-weight: 600;
       line-height: 38px; letter-spacing: 0.01em; text-transform: uppercase; max-width: 350px; text-align: center; color: #f6d9a4;
       background: linear-gradient(180deg, #fff3dc 0%, #f8dcaa 50%, #ecbd74 100%); -webkit-background-clip: text; background-clip: text;
       -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 196, 110, .38)) drop-shadow(0 1px 1px rgba(40, 10, 0, .5)); }
  /* Subhead — Ramp: Lausanne 400, 17px / 23px, ss01, centered */
  .subhead { margin: 0; max-width: 368px; font-family: var(--font); font-feature-settings: "ss01"; font-size: 17px;
             font-weight: 400; line-height: 23px; letter-spacing: normal; text-align: center; color: #fff; }
  .subhead em { font-style: italic; }

  /* Email capture — Ramp's input, centered */
  form { width: 100%; max-width: 368px; margin: 32px auto 0; display: flex; flex-direction: column; gap: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
             clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  input[type="email"] { width: 100%; height: 43px; margin: 0; padding: 0 16px; border: 1px solid var(--ramp-field-border);
    border-radius: 6px; background: rgba(255, 255, 255, .16); color: #fff;
    -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); font-family: var(--font); font-feature-settings: "ss01";
    font-size: 15px; font-weight: 400; line-height: 22.5px; letter-spacing: normal; text-align: center; outline: 0;
    box-shadow: none; transition: border-color 150ms; -webkit-appearance: none; appearance: none; }
  input[type="email"] { border-color: rgba(250, 217, 151, .75); }
  input[type="email"]::placeholder { color: rgba(255, 255, 255, .88); opacity: 1; }
  input[type="email"]:focus { border-color: #fad997; background: rgba(255, 255, 255, .22); }
  button { width: 100%; height: 42px; margin: 0; padding: 0 16px; border: 1px solid #ffb64a; border-radius: 6px;
    background-image: linear-gradient(96.82deg, rgb(250,217,151) 0%, rgb(234,187,95) 50%, rgb(253,235,199) 62.5%, rgb(248,191,76) 74.038%);
    color: var(--ramp-primary); font-family: var(--font); font-feature-settings: "ss01"; font-size: 15px; font-weight: 400;
    line-height: 10.8px; text-align: center; cursor: pointer; transition: filter 300ms ease-in-out; }
  button:hover { filter: brightness(1.05); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,.2); }
  .note { min-height: 20px; margin: 4px 0 0; font-size: 14px; line-height: 20px; color: rgba(255,255,255,.75); }
</style>

      <input id="email" name="email" type="email" placeholder="What’s your work email?" aria-label="Enter your work email" autocomplete="email">
      <button type="submit">Join us for a winter spectacular</button>
      <p class="note" id="note" role="status"></p>
    </form>
  </main>

<script id="bg-frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;      // canvas size in device px
uniform float uTime;

// Procedural stage: velvet back curtain, two swagged side drapes, soft lavender spotlights.
// Everything is computed per pixel, so it stays sharp at any resolution.

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(float x) { float i = floor(x), f = fract(x); float u = f * f * (3.0 - 2.0 * f);
  return mix(hash(vec2(i, 1.7)), hash(vec2(i + 1.0, 1.7)), u); }

// fold phase with irregular spacing so it reads as fabric, not stripes
float foldPhase(float x, float freq, float seed) {
  float ph = x * freq;
  ph += 1.6 * sin(x * freq * 0.27 + seed) + 0.9 * sin(x * freq * 0.61 + seed * 2.3);
  ph += 1.2 * (noise(x * freq * 0.18 + seed) - 0.5);
  return ph;
}
// velvet shading: soft lit crests, deep narrow valleys, a sheen on the flanks
vec2 velvet(float ph) {
  float c = cos(ph);
  float body = pow(0.5 + 0.5 * c, 1.1);
  float valley = smoothstep(-1.0, -0.45, c);
  float shade = mix(0.12, 1.0, body) * mix(0.45, 1.0, valley);
  float sheen = pow(1.0 - abs(c), 4.0) * smoothstep(-0.2, 0.6, sin(ph));
  return vec2(shade, sheen);
}

// palette sampled from the reference comp
const vec3 SHADOW = vec3(0.035, 0.004, 0.075);   // #090113
const vec3 MID    = vec3(0.306, 0.161, 0.431);   // #4e296e
const vec3 LIT    = vec3(0.455, 0.318, 0.651);   // #7451a6
const vec3 HI     = vec3(0.725, 0.635, 0.878);   // #b9a2e0
const vec3 BEAM   = vec3(0.812, 0.745, 0.918);   // #cfbeea

vec3 fabric(vec2 sv, float light) {
  float shade = sv.x;
  vec3 c = mix(SHADOW, MID, smoothstep(0.0, 0.55, shade));
  c = mix(c, LIT, smoothstep(0.55, 1.0, shade));
  c *= light;
  c += HI * sv.y * 0.22 * light * light;
  return c;
}

// spotlight beam: returns cone intensity at p (H units, origin top-centre)
float beam(vec2 p, float ox, float lean) {
  vec2 o = vec2(ox, -0.06);
  vec2 d = normalize(vec2(lean, 1.0));
  vec2 r = p - o;
  float t = dot(r, d);
  if (t < 0.0) return 0.0;
  float perp = abs(r.x * d.y - r.y * d.x);
  float w = 0.022 + t * 0.24;
  return exp(-pow(perp / w, 2.0) * 1.8) * exp(-t / 0.75);
}

void main() {
  float H = uRes.y;
  vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 p = vec2((fc.x - uRes.x * 0.5) / H, fc.y / H);   // x centred, both in screen heights
  float v = p.y;
  float aa = 1.5 / H;

  // ---- lighting: broad centre glow + two spotlight pools ----
  float b1 = beam(p, -0.085, -0.10);
  float b2 = beam(p,  0.085,  0.10);
  float centre = exp(-pow(p.x / 0.62, 2.0) - pow((v - 0.42) / 0.75, 2.0));
  float light = 0.16 + 0.95 * centre + 0.72 * (b1 + b2);

  // ---- back curtain ----
  float ph = foldPhase(p.x, 6.2831853 / 0.105, 3.1) + 0.25 * sin(v * 2.3 + p.x * 3.0);
  vec2 sv = velvet(ph);
  float billow = 0.5 + 0.5 * sin(p.x * 6.2831853 / 0.38 + 1.3 * sin(p.x * 4.1 + 0.7));   // big soft swells
  sv.x *= mix(0.7, 1.08, billow);
  vec3 col = fabric(sv, light);
  // floor-side darkening and top darkening
  col *= mix(1.0, 0.55, smoothstep(0.75, 1.05, v));
  col *= mix(0.6, 1.0, smoothstep(-0.02, 0.18, v));

  // ---- side drapes (swagged, tied back at ~70% height) ----
  for (int side = 0; side < 2; side++) {
    // on narrow (portrait) screens the drapes slide out past the edges so only a hint remains
    float shift = clamp((H * 0.95 - uRes.x) / H, 0.0, 0.3);
    float xs = (side == 0 ? fc.x : uRes.x - fc.x) / H + shift;  // distance from that screen edge
    float tie = 0.70;
    float e = v < tie ? 0.06 + 0.29 * pow(1.0 - v / tie, 1.25)
                      : 0.06 + 0.07 * smoothstep(tie, 1.0, v);
    // shadow the drape casts on the back curtain
    float gap = xs - e;
    col *= 1.0 - 0.65 * exp(-max(gap, 0.0) / 0.05);
    if (gap < aa) {
      float s = clamp(xs / e, 0.0, 1.0);                       // 0 = screen edge, 1 = inner edge
      float dph = foldPhase(s * 5.0 + float(side) * 11.0, 6.2831853, 7.0 + float(side));
      vec2 sv = velvet(dph);
      float dl = 0.16 + 0.75 * smoothstep(0.0, 1.0, s) * (0.45 + 0.55 * centre) + 0.25 * (b1 + b2);
      vec3 dc = fabric(sv, dl);
      // gathered pinch at the tie-back
      dc *= 1.0 - 0.45 * exp(-pow((v - tie) / 0.025, 2.0));
      // inner edge catches the light
      dc += LIT * 0.25 * smoothstep(0.85, 1.0, s) * dl;
      float a = 1.0 - smoothstep(-aa, aa, gap);
      col = mix(col, dc, a);
    }
  }

  // ---- visible light shafts (kept soft) ----
  float hot = exp(-max(v, 0.0) / 0.09);
  col += BEAM * (b1 + b2) * (0.17 + 0.52 * hot);

  // ---- soft dark pool behind the copy for legibility ----
  float pool = exp(-pow(p.x / 0.42, 2.0) - pow((v - 0.6) / 0.32, 2.0));
  col *= 1.0 - 0.32 * pool;

  // vignette
  float vig = smoothstep(0.35, 1.1, length(vec2(p.x / max(uRes.x / H, 1.0) * 1.2, (v - 0.45) * 0.9)));
  col *= 1.0 - 0.55 * vig;

  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;   // dither
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script id="snow-vert" type="x-shader/x-vertex">
attribute vec2 aPos;     // css px
attribute vec4 aData;    // size(css px), alpha, type, rotation
uniform vec2 uView;      // css px viewport
uniform float uDpr;
varying float vAlpha;
varying float vType;
varying float vRot;
varying float vSize;
void main() {
  vec2 clip = (aPos / uView) * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
  gl_PointSize = aData.x * uDpr;
  vSize = aData.x * uDpr;
  vAlpha = aData.y; vType = aData.z; vRot = aData.w;
}
</script>

<script id="snow-frag" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
precision highp float;
varying float vAlpha;
varying float vType;
varying float vRot;
varying float vSize;

float seg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float r = length(p);
  if (r > 1.0) discard;
  float a = 0.0;

  if (vType < 0.5) {
    // soft snow dot
    a = smoothstep(1.0, 0.15, r);
  } else if (vType < 1.5) {
    // six-armed crystal snowflake
    float cs = cos(vRot), sn = sin(vRot);
    p = mat2(cs, -sn, sn, cs) * p;
    float ang = atan(p.y, p.x);
    float sector = mod(ang + 0.5235988, 1.0471976) - 0.5235988;
    vec2 q = r * vec2(cos(sector), abs(sin(sector)));
    float d = seg(q, vec2(0.0), vec2(0.9, 0.0));
    d = min(d, seg(q, vec2(0.40, 0.0), vec2(0.62, 0.20)));
    d = min(d, seg(q, vec2(0.62, 0.0), vec2(0.78, 0.14)));
    d = min(d, seg(q, vec2(0.18, 0.0), vec2(0.27, 0.09)));
    float px = 2.0 / vSize;                  // one device pixel in point space
    float w = max(0.045, px * 0.9);
    a = 1.0 - smoothstep(w - px, w + px, d);
    a = max(a, 1.0 - smoothstep(0.10, 0.10 + px * 1.5, r)); // hub
    a += 0.22 * exp(-r * 3.5);                // soft glow
  } else {
    // out-of-focus bokeh flake
    a = pow(smoothstep(1.0, 0.0, r), 1.6) * (0.75 + 0.25 * smoothstep(0.6, 0.95, r));
  }

  a *= vAlpha * 0.85;   // snow opacity reduced 15%
  vec3 col = vec3(0.96, 0.95, 1.0);
  gl_FragColor = vec4(col * a, a);
}
</script>

<script>
(function () {
  var canvas = document.getElementById('scene');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
  if (!gl) { canvas.style.display = 'none'; return; }
  gl.getExtension('OES_standard_derivatives');

  function compile(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  function program(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); }
    return p;
  }
  var src = function (id) { return document.getElementById(id).textContent; };

  // ---- background program ----
  var bgProg = program('attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }', src('bg-frag'));
  var quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var bgLoc = { p: gl.getAttribLocation(bgProg, 'p'), res: gl.getUniformLocation(bgProg, 'uRes'),
                s: gl.getUniformLocation(bgProg, 'uS'), t: gl.getUniformLocation(bgProg, 'uTime') };

  // ---- snow program ----
  var snowProg = program(src('snow-vert'), src('snow-frag'));
  var snowLoc = { pos: gl.getAttribLocation(snowProg, 'aPos'), data: gl.getAttribLocation(snowProg, 'aData'),
                  view: gl.getUniformLocation(snowProg, 'uView'), dpr: gl.getUniformLocation(snowProg, 'uDpr') };
  var posBuf = gl.createBuffer(), dataBuf = gl.createBuffer();

  // ---- snow umbrella settings (John's tuned mouse interaction) ----
  var UMB = {
    reach: 115,      // px radius the umbrella affects
    strength: 1.6,   // overall push
    hardness: 0.27,  // 0 = soft force field, 1 = solid dome that flakes bounce off
    falloff: 0.5,    // how fast the effect fades with distance
    slide: 1.55,     // sideways slide for flakes landing on top
    bounce: 0.5,     // springy kick when flakes hit the dome
    linger: 0.35,    // how long flakes keep their deflection
    follow: 0.45     // how quickly the umbrella follows the cursor
  };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1, frameS = 1;
  var N = 0, P = [], posArr, dataArr;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function spawn(p, anywhere) {
    var z = Math.pow(Math.random(), 1.6);           // more far flakes than near ones
    var roll = Math.random();
    p.z = z;
    if (z > 0.82 && roll < 0.22) {                  // big soft bokeh, closest to camera
      p.type = 2; p.size = rand(18, 34); p.alpha = rand(0.08, 0.16);
    } else if (z > 0.3 && roll < 0.055) {          // crystal snowflakes
      p.type = 1; p.size = rand(7, 12) + z * z * 22; p.alpha = rand(0.35, 0.85) * (0.5 + z * 0.5);
    } else {                                        // ordinary snow
      p.type = 0; p.size = 1.4 + z * z * 4.2; p.alpha = 0.35 + z * 0.55;
    }
    p.vy = (16 + z * 70) * rand(0.85, 1.15);
    p.phase = rand(0, Math.PI * 2);
    p.sway = rand(6, 18) * (0.4 + z);
    p.rot = rand(0, Math.PI * 2);
    p.spin = rand(-0.6, 0.6);
    p.ex = 0; p.ey = 0;
    p.x = rand(-20, W + 20);
    p.y = anywhere ? rand(-20, H) : rand(-60, -10);
    return p;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    frameS = Math.max(1, H / 874, W / 1300);
    var target = Math.round(Math.min(3200, Math.max(600, W * H / 420)));
    while (P.length < target) P.push(spawn({}, true));
    P.length = target; N = target;
    posArr = new Float32Array(N * 2); dataArr = new Float32Array(N * 4);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---- umbrella (pointer) ----
  var mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999, on: false };
  function point(e) { mouse.tx = e.clientX; mouse.ty = e.clientY; if (!mouse.on) { mouse.x = mouse.tx; mouse.y = mouse.ty; } mouse.on = true; }
  window.addEventListener('pointermove', point, { passive: true });
  window.addEventListener('pointerdown', point, { passive: true });
  window.addEventListener('pointerleave', function () { mouse.on = false; mouse.x = mouse.y = mouse.tx = mouse.ty = -9999; });
  document.addEventListener('mouseleave', function () { mouse.on = false; mouse.x = mouse.y = mouse.tx = mouse.ty = -9999; });

  var t0 = performance.now(), last = t0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var t = (now - t0) / 1000;
    var speed = reduce ? 0.35 : 1;

    if (mouse.on) { mouse.x += (mouse.tx - mouse.x) * UMB.follow; mouse.y += (mouse.ty - mouse.y) * UMB.follow; }
    var R = UMB.reach;
    var decay = Math.pow(0.02 + 0.6 * UMB.linger, dt);
    var gust = Math.sin(t * 0.17) * 8 + Math.sin(t * 0.07 + 1.3) * 6;

    for (var i = 0; i < N; i++) {
      var p = P[i];
      var vx = (Math.sin(t * 0.6 + p.phase) * p.sway + gust * (0.5 + p.z)) ;
      p.x += (vx + p.ex) * dt * speed;
      p.y += (p.vy + p.ey) * dt * speed;
      p.ex *= decay; p.ey *= decay;
      p.rot += p.spin * dt * speed;

      // umbrella: soft force field that fades with distance, blended with a solid dome core
      if (mouse.on && p.z > 0.18) {
        var dx = p.x - mouse.x, dy = p.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          var d = Math.sqrt(d2) || 0.001;
          var nx = dx / d, ny = dy / d;
          var fall = Math.pow(1 - d / R, UMB.falloff);
          var depth = 0.35 + 0.65 * p.z;
          var f = fall * depth * UMB.strength;
          var side = dx >= 0 ? 1 : -1;
          var above = ny < 0 ? -ny : 0;
          p.ex += (nx * 260 + side * 160 * above * UMB.slide) * f * dt;
          p.ey += (ny * 120 - p.vy * 1.6 * above) * f * dt;
          var core = R * 0.62 * UMB.hardness;
          if (core > 4 && d < core) {
            p.x = mouse.x + nx * core; p.y = mouse.y + ny * core;
            var tx = -ny * side, ty = nx * side;
            if (ty < 0) { tx = -tx; ty = -ty; }
            var kick = (60 + p.vy) * UMB.strength;
            p.ex += (tx * kick * UMB.slide + nx * kick * UMB.bounce) * 0.3;
            p.ey += (ty * kick * 0.4 - p.vy * 0.6 + ny * kick * UMB.bounce * 0.5) * 0.3;
          }
        }
      }

      if (p.y > H + 40 || p.x < -60 || p.x > W + 60) spawn(p, false);

      posArr[i * 2] = p.x; posArr[i * 2 + 1] = p.y;
      dataArr[i * 4] = p.size; dataArr[i * 4 + 1] = p.alpha; dataArr[i * 4 + 2] = p.type; dataArr[i * 4 + 3] = p.rot;
    }

    gl.viewport(0, 0, canvas.width, canvas.height);

    // background: procedural velvet curtain shader
    gl.disable(gl.BLEND);
    gl.useProgram(bgProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(bgLoc.p);
    gl.vertexAttribPointer(bgLoc.p, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(bgLoc.res, canvas.width, canvas.height);
    gl.uniform1f(bgLoc.t, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(bgLoc.p);

    // snow
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(snowProg);
    gl.uniform2f(snowLoc.view, W, H);
    gl.uniform1f(snowLoc.dpr, dpr);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(snowLoc.pos);
    gl.vertexAttribPointer(snowLoc.pos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, dataBuf);
    gl.bufferData(gl.ARRAY_BUFFER, dataArr, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(snowLoc.data);
    gl.vertexAttribPointer(snowLoc.data, 4, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disableVertexAttribArray(snowLoc.pos);
    gl.disableVertexAttribArray(snowLoc.data);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// Demo-only form: nothing is sent anywhere.
document.getElementById('rsvp').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = document.getElementById('email').value.trim();
  document.getElementById('note').textContent = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)
    ? "You're on the list. See you in the West End."
    : 'Please enter a valid work email.';
});
</script>
